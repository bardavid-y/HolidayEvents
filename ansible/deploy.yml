---
- name: Deploy Holiday Events to Ubuntu Servers
  hosts: app_servers
  become: yes
  tasks:
    # --- 1. SETUP PREREQUISITES ---
    - name: Install Docker and Python Docker SDK
      ansible.builtin.apt:
        name: 
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # --- 2. DEPLOY APPLICATION ---
    - name: Pull the updated Docker image
      community.docker.docker_image:
        name: "bardavid/holiday-events:{{ image_tag }}"
        source: pull

    - name: Run the application container
      community.docker.docker_container:
        name: HolidayEvents
        image: "bardavid/holiday-events:{{ image_tag }}"
        state: started
        restart_policy: always
        recreate: yes
        published_ports:
          - "3000:3000"

    - name: Clean up dangling images
      community.docker.docker_prune:
        images: yes
        images_filters:
          dangling: true